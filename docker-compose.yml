version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: home-goods-postgres
    environment:
      POSTGRES_USER: homegoods
      POSTGRES_PASSWORD: homegoods123
      POSTGRES_DB: home_goods_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homegoods"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: home-goods-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  localstack:
    image: localstack/localstack:latest
    container_name: home-goods-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,sqs,sns
      DEBUG: 1
      DATA_DIR: /tmp/localstack/data
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstack_data:/tmp/localstack

volumes:
  postgres_data:
  pgadmin_data:
  localstack_data:
